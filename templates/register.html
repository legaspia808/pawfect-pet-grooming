{% extends "base.html" %}{% block title %}Create account | Pawfect{% endblock %}{% block content %}<section class="form-page"><div class="form-decoration">✿</div><div class="form-card"><span class="eyebrow">JOIN OUR PAWFECT FAMILY</span><h1>Let's meet your pet.</h1><p>Create an account to request appointments and share your favorite grooming moments.</p><form method="post"><label>Your full name<input name="name" maxlength="100" required autocomplete="name"></label><label>Email address<input type="email" name="email" required autocomplete="email"></label><label>Password <small>(at least 8 characters)</small><input type="password" name="password" minlength="8" required autocomplete="new-password"></label><button class="button full" type="submit">Create my account →</button></form><p class="form-foot">Already have an account? <a href="{{ url_for('login') }}">Log in</a></p></div></section>{% endblock %}
